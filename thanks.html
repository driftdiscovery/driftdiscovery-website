<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Thank You — Drift</title>
  <meta
    name="description"
    content="Your message has found its way to Drift."
  />
  <meta name="theme-color" content="#0b0c0f" />

  <style>
    /*
      "Give thanks to the Lord, for he is good;
      his love endures forever."
      — Psalm 107:1
    */

    :root {
      --background: #0b0c0f;
      --surface: rgba(22, 24, 29, 0.72);
      --text: #f2efe8;
      --muted: #aaa69d;
      --quiet: #77746d;
      --border: rgba(255, 255, 255, 0.11);
      --accent: #c8b58a;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(91, 82, 65, 0.18), transparent 34rem),
        radial-gradient(circle at 85% 80%, rgba(55, 67, 70, 0.15), transparent 30rem),
        var(--background);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .page {
      position: relative;
      width: min(100% - 40px, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 0;
    }

    .wordmark {
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      letter-spacing: 0.22em;
      text-decoration: none;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 60px 0 100px;
    }

    .message {
      width: min(100%, 650px);
      padding: clamp(34px, 7vw, 64px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin-bottom: 22px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 8vw, 72px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      max-width: 470px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .return-link {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      color: #17150f;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .return-link:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    footer {
      padding: 24px 0 30px;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--quiet);
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!--
    "A word fitly spoken is like apples of gold
    in settings of silver."
    — Proverbs 25:11
  -->

  <div class="page">
    <header>
      <a class="wordmark" href="/" aria-label="Drift home">Drift</a>
    </header>

    <main>
      <section class="message">
        <div class="eyebrow">Message received</div>

        <h1>Thank you.</h1>

        <p>
          Your note found its way to Drift. We’ll read it thoughtfully
          and respond if a reply is needed.
        </p>

        <a class="return-link" href="/">Return to Drift</a>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> Drift</span>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
